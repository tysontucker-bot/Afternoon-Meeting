<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Afternoon Meeting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F7FB;--panel:#FFFFFF;--ink:#14213D;--muted:#5A6680;--line:#D6DEEA;
  --feel:#D6336C;--news:#0077B6;--letter:#E05A00;--songs:#0B8A8A;--word:#7B2CBF;
  --right:#2B8A3E;--warn:#D98E00;--focus:#FFB703;--sec:var(--feel);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
img{max-width:100%}
#app{height:100%}

/* shared */
.center{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.2rem;padding:2rem;text-align:center}
.center h1{margin:0;font-size:clamp(2rem,6vw,3.4rem);line-height:1.1}
.center p{margin:0;color:var(--muted);max-width:38ch;line-height:1.5}
.big{border:0;border-radius:18px;padding:1.1rem 1.6rem;font-size:1.15rem;font-weight:600;background:var(--ink);color:var(--bg);min-width:13rem}
.big.alt{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.row{display:flex;gap:.7rem;flex-wrap:wrap;justify-content:center}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:.4rem}
.btn{border:2px solid var(--line);background:var(--panel);border-radius:12px;padding:.7rem 1rem;font-weight:600}
.btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:#C62828}
.field{display:flex;flex-direction:column;gap:.35rem;text-align:left;width:100%;max-width:30rem}
.field span{font-size:.9rem;color:var(--muted);font-weight:600}
input[type=text],input[type=url]{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:.7rem .8rem;width:100%}
.toast{position:fixed;top:calc(1rem + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;z-index:20;max-width:90vw}
.pic,.ini{border-radius:50%;object-fit:cover;flex:none}
.ini{display:grid;place-items:center;background:color-mix(in srgb,var(--sec) 20%,var(--panel));color:var(--sec);font-weight:700}

/* projector */
.stage{height:100%;display:flex;flex-direction:column}
.band{background:var(--sec);color:#fff;padding:1.4vh 2.4vw}
.path{display:flex;gap:1vw;align-items:center;flex-wrap:wrap}
.step{border-radius:999px;padding:.8vh 1.6vw;font-weight:600;font-size:clamp(.9rem,2.4vh,1.8rem);border:.35vh solid rgba(255,255,255,.55);color:rgba(255,255,255,.9);white-space:nowrap}
.step.now{background:#fff;color:var(--sec);border-color:#fff;font-size:clamp(1.1rem,3.4vh,2.6rem);font-weight:700;padding:1vh 2.2vw}
.arrow{opacity:.6;font-size:clamp(.9rem,2.4vh,1.8rem)}
.content{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:3vw;padding:3vh 3vw}
.songcol{min-height:0;display:flex;flex-direction:column;justify-content:center;gap:2vh;text-align:center}
.songcol h2{margin:0;font-size:clamp(1.6rem,6vh,4.4rem);line-height:1.1}
.player{width:100%;aspect-ratio:16/9;border-radius:1.6vh;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.nosong{width:100%;aspect-ratio:16/9;border-radius:1.6vh;border:.5vh dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:2.4vh;padding:2vh}
.ftable{min-height:0;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);border:.5vh solid var(--line);border-radius:2vh;overflow:hidden;background:var(--panel)}
.frow{display:contents}
.fh{padding:1.2vh 1.4vw;background:var(--sec);color:#fff;font-weight:700;font-size:clamp(1rem,3vh,2.2rem)}
.fc{min-height:0;display:flex;align-items:center;gap:1.2vw;padding:.5vh 1.4vw;border-top:.3vh solid var(--line);font-weight:600;font-size:var(--fs,3vh);overflow:hidden;white-space:nowrap}
.fc + .fc{border-left:.3vh solid var(--line)}
.fc .pic,.fc .ini{height:calc(var(--fs,3vh) * 1.9);width:calc(var(--fs,3vh) * 1.9)}
.fc .fpic{height:calc(var(--fs,3vh) * 1.9);width:auto;object-fit:contain}
.fc .wait{color:var(--line)}
.fc.away{color:var(--muted);font-style:italic}
.frow.turn .fc{background:color-mix(in srgb,var(--sec) 16%,var(--panel))}
.frow.turn .fc:first-child{box-shadow:inset 1vw 0 0 var(--sec)}
.fc.fresh{animation:pop .45s}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
.corner{position:fixed;right:1rem;bottom:1rem;display:flex;gap:.5rem;align-items:center}
.corner .btn{opacity:.25;padding:.45rem .7rem;font-size:.9rem}
.corner .btn:hover,.corner .btn:focus-visible{opacity:1}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:var(--right)}
.dot.off{background:var(--warn)}

/* remote + edit */
.remote{max-width:820px;margin:0 auto;padding:1rem 1rem 3rem}
.top{display:flex;align-items:center;justify-content:space-between;gap:.8rem;margin-bottom:1rem}
.top h1{margin:0;font-size:1.3rem}
.status{display:flex;align-items:center;gap:.4rem;font-size:.85rem;color:var(--muted)}
.projline{margin:-.4rem 0 1rem;padding:.6rem .8rem;border-radius:10px;font-size:.92rem;background:var(--panel);border:2px solid var(--line)}
.projline.ok{border-color:var(--right)}
.projline.warn{border-color:var(--warn)}
.projline.off{border-color:var(--line);color:var(--muted)}
.player{position:relative}
.clickplay{position:absolute;inset:0;margin:auto;width:max-content;height:max-content;border:0;border-radius:999px;background:var(--sec);color:#fff;font-weight:700;font-size:clamp(1rem,3.4vh,2.2rem);padding:2vh 3vw;box-shadow:0 1vh 3vh rgba(0,0,0,.35)}
.songmsg{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);color:#fff;padding:1.4vh 1.6vw;font-size:2.2vh;text-align:center}
.songbar{display:flex;gap:.6rem;margin-bottom:1rem;flex-wrap:wrap}
.songbar .btn{flex:1}
.turnbox{display:flex;align-items:center;gap:1rem;background:var(--sec);color:#fff;border-radius:18px;padding:1rem 1.2rem;margin-bottom:1rem}
.turnbox .pic,.turnbox .ini{height:4.5rem;width:4.5rem;border:3px solid #fff;font-size:1.8rem}
.turnbox small{display:block;opacity:.85;font-weight:600}
.turnbox strong{font-size:2rem;line-height:1.1}
.faces{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin-bottom:.8rem}
.face{border:3px solid var(--line);background:var(--panel);border-radius:16px;padding:.6rem;display:flex;flex-direction:column;align-items:center;gap:.3rem;font-weight:600}
.face img{height:5.5rem;object-fit:contain}
.away-btn{width:100%;font-size:1.25rem;padding:1rem;margin-bottom:1.2rem;border:3px dashed var(--line);background:var(--panel);border-radius:16px;font-weight:700}
.label{font-size:.9rem;color:var(--muted);margin:1rem 0 .5rem}
.names{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1rem}
.name{border:3px solid var(--line);background:var(--panel);border-radius:999px;padding:.4rem .9rem .4rem .4rem;font-weight:600;display:flex;align-items:center;gap:.5rem}
.name .pic,.name .ini{height:2rem;width:2rem;font-size:.9rem}
.name[aria-pressed="true"]{border-color:var(--sec);background:var(--sec);color:#fff}
.name small{opacity:.75;font-weight:400}
.srow{display:grid;grid-template-columns:auto 1fr auto auto auto;gap:.5rem;align-items:center;margin-bottom:.6rem}
.srow .pic,.srow .ini{height:3.2rem;width:3.2rem;font-size:1.2rem}
.photo{border:0;background:none;padding:0;border-radius:50%;position:relative}
.photo .add{position:absolute;right:-4px;bottom:-4px;background:var(--ink);color:var(--bg);border-radius:50%;width:1.3rem;height:1.3rem;font-size:.85rem;display:grid;place-items:center}
.icon{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:.45rem .65rem}
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:1rem;margin-bottom:1rem}
.card h2{margin:0 0 .8rem;font-size:1.15rem}
.symgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(6.5rem,1fr));gap:.6rem;margin:.6rem 0}
.sym{border:3px solid var(--line);background:var(--panel);border-radius:14px;padding:.5rem;display:flex;flex-direction:column;align-items:center;gap:.25rem;font-weight:600;font-size:.9rem}
.sym img{width:100%;aspect-ratio:1;object-fit:contain}
.sym.on{border-color:var(--sec)}
.nosym{width:100%;aspect-ratio:1;display:grid;place-items:center;color:var(--line);font-size:2rem}
.symsearch{border-top:2px solid var(--line);padding-top:.6rem;margin-top:.4rem}
.credit{color:var(--muted);font-size:.75rem;margin:.6rem 0 0}
.note{color:var(--muted);font-size:.9rem;margin:.4rem 0 .8rem;line-height:1.4}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
(() => {
/* ---------- fixed content ---------- */
const PATH = [
  {k:"feel",   name:"How was your day?", short:"Feelings"},
  {k:"news",   name:"News-2-You",        short:"News"},
  {k:"letter", name:"Letter of the Day", short:"Letter"},
  {k:"songs",  name:"Social Songs",      short:"Songs"},
  {k:"word",   name:"Word of the Week",  short:"Word"}
];
const FEELINGS = ["happy","sad","angry","frustrated","excited","silly","tired","surprised","embarrassed"]
  .map(id => ({id, label:id[0].toUpperCase()+id.slice(1)}));
/* symbols come from ARASAAC (the set Global Symbols hosts) */
const ARA_IMG = id => "https://static.arasaac.org/pictograms/"+id+"/"+id+"_500.png";
const ARA_API = "https://api.arasaac.org/api/pictograms/en/";
let autoSym = {};   // feeling -> pictogram id found automatically
async function araSearch(term, best){
  const r = await fetch(ARA_API+(best?"bestsearch/":"search/")+encodeURIComponent(term));
  if(!r.ok) return [];
  const j = await r.json(); return Array.isArray(j) ? j.map(x=>x._id).filter(Boolean) : [];
}
function symId(f){ return (settings.feelSymbols||{})[f.id] || autoSym[f.id] || null; }
function feelPic(f, cls){ const id=symId(f); return id ? h("img",{class:cls||"",src:ARA_IMG(id),alt:""}) : null; }
async function fillAutoSymbols(){
  let changed=false;
  for(const f of FEELINGS){
    if((settings.feelSymbols||{})[f.id] || autoSym[f.id]) continue;
    const cached=ls("am-ara-"+f.id);
    if(cached){ autoSym[f.id]=Number(cached); changed=true; continue; }
    try{
      let ids=await araSearch(f.label,true); if(!ids.length) ids=await araSearch(f.label,false);
      if(ids.length){ autoSym[f.id]=ids[0]; ls("am-ara-"+f.id,String(ids[0])); changed=true; }
    }catch(e){}
  }
  if(changed && screen!=="edit") { if(screen==="projector") projKey=null; render(); }
}
const DEFAULT_SONG = "https://www.youtube.com/watch?v=gVvld8hR01w";

/* ---------- state ---------- */
const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
let cfg = {url: ls("am-url")||"", code: ls("am-code")||""};
let screen = params.get("screen") || ls("am-screen") || null;   // projector | remote | edit
let roster = [], rosterVersion = null, settings = {};
let live = {page:1, day:"", picks:{}, turn:null, vid:{cmd:"pause", n:0}};
let online = false, started = false, lastWrite = 0, pollTimer = null, quietSince = Date.now();
let player = null, playerReady = false, playerVideo = null, lastVidN = null;
let draft = null;   // edit-mode copy of roster
let songStatus = {};          // what the projector reports back (remote reads this)
let myStatus = "", lastStatusSent = 0;

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); v===null?localStorage.removeItem(k):localStorage.setItem(k,v);}catch(e){return null} }
const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toLocaleDateString("en-CA");
const picks = () => live.day===today() ? (live.picks||{}) : {};
const turnId = () => live.day===today() ? (live.turn||null) : null;
function ytId(u){ const m=(u||"").match(/(?:youtu\.be\/|v=|embed\/|shorts\/)([\w-]{11})/); return m?m[1]:null; }
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v==null||v===false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2),v);
    else if (k==="style"&&typeof v==="object") Object.entries(v).forEach(([p,val])=>el.style.setProperty(p,val));
    else if (k==="value") el.value=v;
    else el.setAttribute(k, v===true?"":v);
  }
  for (const c of kids.flat()) if (c!=null&&c!==false) el.append(c.nodeType?c:String(c));
  return el;
}
function toast(msg){ document.querySelectorAll(".toast").forEach(t=>t.remove()); const t=h("div",{class:"toast",role:"status"},msg); document.body.append(t); setTimeout(()=>t.remove(),2600); }
function avatar(k){ return k&&k.photo ? h("img",{class:"pic",src:k.photo,alt:""}) : h("span",{class:"ini","aria-hidden":"true"},((k&&k.name)||"?").trim().charAt(0).toUpperCase()||"?"); }

/* ---------- talking to the Google Sheet ---------- */
async function apiGet(what){
  const r = await fetch(cfg.url+"?code="+encodeURIComponent(cfg.code)+(what?"&what="+what:"")+"&t="+Date.now());
  const j = await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
}
async function apiPost(body){
  const r = await fetch(cfg.url,{method:"POST",body:JSON.stringify({...body,code:cfg.code})});
  const j = await r.json(); if(!j.ok) throw new Error(j.error||"error"); return j;
}
// one live write at a time, newest wins
let busy=false, pendingLive=null;
async function pushLive(){
  if(busy) return; busy=true;
  while(pendingLive){
    const d=pendingLive; pendingLive=null;
    try{ await apiPost({action:"live",live:d}); online=true; }
    catch(e){ online=false; toast("Couldn't reach the Google Sheet. Check Wi-Fi."); }
    lastWrite=Date.now();
  }
  busy=false;
}
function setLive(patch){
  live={...live,...patch}; lastWrite=Date.now();
  render();
  pendingLive=JSON.parse(JSON.stringify(live)); pushLive();
}
async function refresh(){
  try{
    const j = await apiGet(rosterVersion==null ? "all" : "");
    online=true;
    if (j.roster){ roster=j.roster; rosterVersion=j.rosterVersion; }
    else if (j.rosterVersion!==rosterVersion){ const a=await apiGet("all"); roster=a.roster||[]; rosterVersion=a.rosterVersion; }
    settings=j.settings||{};
    songStatus=j.status||{};
    // don't let an older copy from the sheet overwrite taps that are still sending
    if (!busy && !pendingLive && Date.now()-lastWrite>2500){
      const changed = JSON.stringify(j.live)!==JSON.stringify(live);
      if (j.live && Object.keys(j.live).length) live={...live,...j.live};
      if (changed) quietSince=Date.now();
    }
    return true;
  }catch(e){
    online=false;
    if (String(e.message)==="bad_code"){ toast("That class code doesn't match. Re-enter it."); cfg.code=""; ls("am-code",null); }
    return false;
  }
}
function startPolling(){
  clearTimeout(pollTimer);
  const tick = async ()=>{
    if (document.visibilityState==="visible" && screen!=="edit"){ await refresh(); if(screen!=="edit") render(); }
    if (screen==="projector" && Date.now()-lastStatusSent>30000) report(started ? (myStatus||"starting") : "waiting");
    // projector checks fast; slows down if nothing has changed for 10 minutes
    const fast = Date.now()-quietSince < 10*60*1000;
    const wait = screen==="projector" ? (fast?1500:8000) : 4000;
    pollTimer=setTimeout(tick, wait);
  };
  tick();
}

/* ---------- router ---------- */
function render(){
  if (!cfg.url || !cfg.code) return renderSetup();
  if (!screen) return renderChooser();
  if (screen==="projector") return renderProjector();
  if (screen==="edit") return renderEdit();
  return renderRemote();
}
function go(s){ screen=s; ls("am-screen",s); if(s==="edit") draft=null; render(); }
function changeScreen(){ screen=null; ls("am-screen",null); started=false; destroyPlayer(); history.replaceState(null,"",location.pathname); render(); }

function renderSetup(){
  const url=h("input",{type:"url",value:cfg.url,placeholder:"https://script.google.com/macros/s/…/exec"});
  const code=h("input",{type:"text",inputmode:"numeric",value:cfg.code,placeholder:"6-digit code"});
  const btn=h("button",{class:"big",onclick:async()=>{
    cfg={url:url.value.trim(),code:code.value.trim()};
    if(!/^https:\/\/script\.google\.com\//.test(cfg.url)){ toast("Paste the Web app link from Apps Script."); return; }
    btn.disabled=true; btn.textContent="Connecting…";
    const ok=await refresh();
    btn.disabled=false; btn.textContent="Connect";
    if(!ok){ toast("Couldn't connect. Check the link and code."); return; }
    ls("am-url",cfg.url); ls("am-code",cfg.code); startPolling(); render();
  }},"Connect");
  app.replaceChildren(h("div",{class:"center"},
    h("h1",{},"Connect this device"),
    h("p",{},"Paste the Web app link and class code from your Apps Script. Do this once on the computer and once on your iPad."),
    h("label",{class:"field"},h("span",{},"Web app link"),url),
    h("label",{class:"field"},h("span",{},"Class code"),code),
    btn));
}
function renderChooser(){
  app.replaceChildren(h("div",{class:"center"},
    h("h1",{},"Afternoon Meeting"),
    h("p",{},"Which screen is this?"),
    h("div",{class:"row"},
      h("button",{class:"big",onclick:()=>go("projector")},"Projector"),
      h("button",{class:"big alt",onclick:()=>go("remote")},"iPad remote"),
      h("button",{class:"big alt",onclick:()=>go("edit")},"Edit class list")),
    h("button",{class:"link",onclick:()=>{ if(confirm("Disconnect this device from the Google Sheet?")){cfg={url:"",code:""};ls("am-url",null);ls("am-code",null);render();} }},"Disconnect this device")));
}

/* ---------- projector ---------- */
function pathBar(cur){
  const bar=h("nav",{class:"path","aria-label":"Meeting order"});
  PATH.forEach((p,j)=>{ if(j) bar.append(h("span",{class:"arrow","aria-hidden":"true"},"›"));
    bar.append(h("span",{class:"step"+(p.k===cur?" now":"")}, p.k===cur?p.name:p.short)); });
  return bar;
}
let projKey=null;
function renderProjector(){
  if(!started){
    projKey=null;
    app.replaceChildren(h("div",{class:"center"},
      h("h1",{},"Afternoon Meeting"),
      h("p",{},"Click Start once so the song can play with sound. After that, your iPad runs everything."),
      h("button",{class:"big",onclick:()=>{started=true;try{document.documentElement.requestFullscreen?.().catch(()=>{})}catch(e){};report("starting");render();}},"Start projector"),
      h("button",{class:"link",onclick:changeScreen},"Change which screen this is")));
    return;
  }
  const key=JSON.stringify([roster.map(k=>[k.id,k.name,k.photo.length]),settings.feelSymbols||{},autoSym]);
  if(key!==projKey || !app.querySelector(".stage")){ projKey=key; buildProjector(); }
  ensurePlayer();
  applyProjector();
}
function buildProjector(){
  const n=roster.length;
  const fs="min(5vh, "+(62/Math.max(n,1)).toFixed(2)+"vh)";
  const table=h("div",{class:"ftable",style:{"grid-template-rows":"auto repeat("+Math.max(n,1)+",minmax(0,1fr))","--fs":fs}},
    h("div",{class:"frow"},h("div",{class:"fh"},"Name"),h("div",{class:"fh"},"Feeling")),
    n ? roster.map(k=>h("div",{class:"frow","data-kid":k.id},h("div",{class:"fc"},avatar(k),h("span",{},k.name)),h("div",{class:"fc fv"})))
      : h("div",{class:"frow"},h("div",{class:"fc"},"Add students in Edit class list"),h("div",{class:"fc"})));
  // if the projector is already up, swap only the table so the song player isn't reloaded
  const oldTable = app.querySelector(".stage .ftable");
  if (oldTable){ oldTable.replaceWith(table); return; }
  const stage=h("div",{class:"stage"},
    h("header",{class:"band"},pathBar("feel")),
    h("main",{class:"content"},
      h("div",{class:"songcol"}, h("div",{class:"player"},h("div",{id:"yt"}))),
      table),
    h("div",{class:"corner"},
      h("span",{class:"dot","aria-label":"Connection"}),
      h("button",{class:"btn",onclick:()=>{try{document.documentElement.requestFullscreen?.().catch(()=>{})}catch(e){}}},"⛶ Full screen"),
      h("button",{class:"btn",onclick:()=>{try{document.fullscreenElement&&document.exitFullscreen()}catch(e){};changeScreen();}},"✕ Exit projector")));
  app.replaceChildren(stage);
}
function applyProjector(){
  const dot=app.querySelector(".dot"); if(dot) dot.className="dot"+(online?"":" off");
  const p=picks(), t=turnId();
  app.querySelectorAll(".frow[data-kid]").forEach(row=>{
    const id=row.dataset.kid; row.classList.toggle("turn",id===t);
    const cell=row.querySelector(".fv"), v=p[id]||"";
    if(cell.dataset.done && cell.dataset.v===v) return;
    const changed=cell.dataset.done && cell.dataset.v!==v;
    cell.dataset.v=v; cell.dataset.done="1";
    const f=FEELINGS.find(x=>x.id===v);
    cell.className="fc fv"+(v==="absent"?" away":"")+(changed&&v?" fresh":"");
    cell.replaceChildren(...(v==="absent"?["Not here"]
      : f?[feelPic(f,"fpic"),h("span",{},f.label)]
      : [h("span",{class:"wait"},"…")]));
  });
  applyVideo();
}

/* YouTube player on the projector */
function songId(){ return ytId(settings.songUrl || DEFAULT_SONG); }
function loadYT(){
  return new Promise(res=>{
    if(window.YT&&window.YT.Player) return res();
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{ prev&&prev(); res(); };
    if(!document.getElementById("yt-api")) document.head.append(h("script",{id:"yt-api",src:"https://www.youtube.com/iframe_api"}));
  });
}
let creating=false;
async function ensurePlayer(){
  const id=songId();
  if(player&&playerReady){ if(id&&id!==playerVideo){ player.cueVideoById(id); playerVideo=id; } return; }
  if(creating||!id||!document.getElementById("yt")) return;
  creating=true; await loadYT();
  lastVidN = live.vid?.n ?? 0;   // don't replay an old command on load
  player=new YT.Player("yt",{videoId:id,playerVars:{rel:0,playsinline:1,modestbranding:1},
    events:{
      onReady:()=>{playerReady=true;playerVideo=id;creating=false;report("ready");},
      onStateChange:e=>{ const m={1:"playing",2:"paused",0:"ended",3:"loading"}; if(m[e.data]){ hideClickToPlay(); report(m[e.data]); } },
      onError:e=>{ creating=false; report(e.data===101||e.data===150?"blocked":"error");
        const box=app.querySelector(".player"); if(box) box.append(h("div",{class:"songmsg"},
          e.data===101||e.data===150 ? "This song's owner doesn't allow it to play inside other sites. Pick a different song in Edit." : "The song couldn't load. Check the link in Edit.")); }
    }});
}
function destroyPlayer(){ try{player&&player.destroy()}catch(e){} player=null;playerReady=false;playerVideo=null;creating=false; }
function applyVideo(){
  const n=live.vid?.n ?? 0;
  if(lastVidN===null){ lastVidN=n; return; }
  if(!player||!playerReady||n===lastVidN) return;
  lastVidN=n;
  const cmd=live.vid.cmd;
  if(cmd==="pause") player.pauseVideo();
  else {
    if(cmd==="restart") player.seekTo(0,true);
    player.playVideo();
    // browsers sometimes block a song from starting until someone clicks on this computer
    setTimeout(()=>{ try{ const st=player.getPlayerState(); if(st!==1&&st!==3){ showClickToPlay(); report("needs-click"); } }catch(e){} },2500);
  }
}
function showClickToPlay(){
  const box=app.querySelector(".player"); if(!box||box.querySelector(".clickplay")) return;
  box.append(h("button",{class:"clickplay",onclick:()=>{ hideClickToPlay(); try{player.playVideo();}catch(e){} }},"▶ Click here to start the song"));
}
function hideClickToPlay(){ app.querySelectorAll(".clickplay").forEach(b=>b.remove()); }
function report(state){
  myStatus=state;
  if(!cfg.url) return;
  lastStatusSent=Date.now();
  apiPost({action:"status",status:{state,at:Date.now()}}).catch(()=>{});
}

/* ---------- iPad remote ---------- */
function topBar(title){
  return h("div",{class:"top"},
    h("h1",{},title),
    h("div",{class:"row"},
      h("span",{class:"status"},h("span",{class:"dot"+(online?"":" off")}),online?"Connected":"Offline"),
      h("button",{class:"btn",onclick:changeScreen},"Switch")));
}
function projectorLine(){
  const st=songStatus.state, fresh=songStatus.at && Date.now()-songStatus.at<75000;
  const msg = !fresh ? ["off","The projector isn't open. Open it on the computer and click Start projector."]
    : st==="waiting" ? ["warn","The projector is open but waiting. Click Start projector on the computer."]
    : st==="blocked" ? ["warn","This song can't play inside other sites. Pick a different song in Edit."]
    : st==="error" ? ["warn","The song couldn't load on the projector. Check the link in Edit."]
    : st==="needs-click" ? ["warn","The computer blocked the song from starting. Click the button on the projector screen once."]
    : st==="playing" ? ["ok","Song is playing."]
    : st==="loading" ? ["ok","Song is loading…"]
    : ["ok","Projector is ready."];
  return h("p",{class:"projline "+msg[0]},msg[1]);
}
function nextAfter(id,p){ const i=roster.findIndex(k=>k.id===id); for(let j=1;j<=roster.length;j++){ const k=roster[(i+j)%roster.length]; if(!p[k.id]) return k.id; } return null; }
function renderRemote(){
  const wrap=h("div",{class:"remote"});
  wrap.append(topBar("How was your day?"));
  const n=(live.vid?.n||0)+1;
  wrap.append(h("div",{class:"songbar"},
    h("button",{class:"btn solid",onclick:()=>setLive({vid:{cmd:"play",n}})},"▶ Play song"),
    h("button",{class:"btn",onclick:()=>setLive({vid:{cmd:"pause",n}})},"Pause"),
    h("button",{class:"btn",onclick:()=>setLive({vid:{cmd:"restart",n}})},"Start over")));
  wrap.append(projectorLine());
  if(!roster.length){
    wrap.append(h("div",{class:"card"},h("p",{class:"note"},"No students yet."),h("button",{class:"btn solid",onclick:()=>go("edit")},"Add your class list")));
    app.replaceChildren(wrap); return;
  }
  const p=picks(); let t=turnId();
  if(!t||!roster.some(k=>k.id===t)) t=(roster.find(k=>!p[k.id])||{}).id||null;
  const who=roster.find(k=>k.id===t);
  const answer=v=>{ if(!who) return; const np={...p,[who.id]:v}; setLive({day:today(),picks:np,turn:nextAfter(who.id,np)}); };
  wrap.append(who
    ? h("div",{class:"turnbox"},avatar(who),h("div",{},h("small",{},"Whose turn"),h("strong",{},who.name)))
    : h("div",{class:"turnbox"},h("div",{},h("small",{},"All done"),h("strong",{},"Everyone has answered"))));
  wrap.append(h("div",{class:"faces"},FEELINGS.map(f=>h("button",{class:"face",disabled:!who,onclick:()=>answer(f.id)},feelPic(f),f.label))));
  wrap.append(h("button",{class:"away-btn",disabled:!who,onclick:()=>answer("absent")},"Not here"));
  wrap.append(h("div",{class:"label"},"Pick a different student"));
  wrap.append(h("div",{class:"names"},roster.map(k=>{
    const v=p[k.id], f=FEELINGS.find(x=>x.id===v);
    return h("button",{class:"name","aria-pressed":String(k.id===t),onclick:()=>setLive({day:today(),picks:p,turn:k.id})},
      avatar(k),k.name, v ? h("small",{},v==="absent"?"not here":f?f.label:"") : null);
  })));
  wrap.append(h("div",{class:"row",style:{"justify-content":"flex-start"}},
    who&&p[who.id]?h("button",{class:"btn",onclick:()=>{const np={...p};delete np[who.id];setLive({day:today(),picks:np,turn:who.id});}},"Clear "+who.name):null,
    h("button",{class:"btn danger",onclick:()=>{ if(confirm("Clear everyone's answers for today?")) setLive({day:today(),picks:{},turn:null}); }},"Clear all"),
    h("button",{class:"btn",onclick:()=>go("edit")},"Edit class list")));
  const y=window.scrollY; app.replaceChildren(wrap); window.scrollTo(0,y);
}

/* ---------- edit class list ---------- */
function renderEdit(){
  if(!draft) draft={roster:roster.map(k=>({...k})), song:settings.songUrl||DEFAULT_SONG, syms:{...(settings.feelSymbols||{})}, open:null, results:[], q:"", dirty:false};
  const wrap=h("div",{class:"remote"});
  wrap.append(topBar("Edit"));
  const mark=()=>{draft.dirty=true;};
  const songIn=h("input",{type:"url",value:draft.song,oninput:e=>{draft.song=e.target.value.trim();mark();}});
  wrap.append(h("div",{class:"card"},h("h2",{},"Feelings song"),
    h("p",{class:"note"},"Paste a YouTube link. It plays next to the class table."),songIn));
  const symCard=h("div",{class:"card"},h("h2",{},"Feelings symbols"),
    h("p",{class:"note"},"Tap a feeling to pick a different symbol."));
  const grid=h("div",{class:"symgrid"});
  FEELINGS.forEach(f=>{
    const id=draft.syms[f.id]||autoSym[f.id];
    grid.append(h("button",{class:"sym"+(draft.open===f.id?" on":""),onclick:()=>openSym(f)},
      id?h("img",{src:ARA_IMG(id),alt:""}):h("span",{class:"nosym"},"?"), f.label));
  });
  symCard.append(grid);
  if(draft.open){
    const f=FEELINGS.find(x=>x.id===draft.open);
    const q=h("input",{type:"text",value:draft.q,"aria-label":"Search symbols",onkeydown:e=>{if(e.key==="Enter")runSym(e.target.value);}});
    symCard.append(h("div",{class:"symsearch"},
      h("div",{class:"label"},"Symbols for "+f.label),
      h("div",{class:"row",style:{"justify-content":"flex-start","flex-wrap":"nowrap"}},q,h("button",{class:"btn",onclick:()=>runSym(q.value)},"Search")),
      h("div",{class:"symgrid"}, draft.results.length ? draft.results.map(id=>h("button",{class:"sym"+(id===(draft.syms[f.id]||autoSym[f.id])?" on":""),
        onclick:()=>{draft.syms[f.id]=id;draft.open=null;mark();renderEdit();}},h("img",{src:ARA_IMG(id),alt:"",loading:"lazy"})))
        : h("p",{class:"note"},draft.searching?"Searching…":"No symbols found. Try another word.")),
      h("button",{class:"btn",onclick:()=>{draft.open=null;renderEdit();}},"Done")));
  }
  symCard.append(h("p",{class:"credit"},"Pictograms: Sergio Palao, ARASAAC (arasaac.org), CC BY-NC-SA, via Global Symbols."));
  wrap.append(symCard);
  const list=h("div",{class:"card"},h("h2",{},"Class list"),
    h("p",{class:"note"},"Names and photos are saved in your Google Sheet, not on GitHub."));
  draft.roster.forEach((k,i)=>list.append(h("div",{class:"srow"},
    h("button",{class:"photo","aria-label":"Photo for "+(k.name||"student"),onclick:()=>pickPhoto(url=>{k.photo=url;mark();renderEdit();})},
      avatar(k),h("span",{class:"add","aria-hidden":"true"},k.photo?"✎":"+")),
    h("input",{type:"text",value:k.name,placeholder:"Student name",oninput:e=>{k.name=e.target.value;mark();}}),
    h("button",{class:"icon","aria-label":"Move up",disabled:i===0,onclick:()=>{[draft.roster[i-1],draft.roster[i]]=[draft.roster[i],draft.roster[i-1]];mark();renderEdit();}},"↑"),
    h("button",{class:"icon","aria-label":"Move down",disabled:i===draft.roster.length-1,onclick:()=>{[draft.roster[i+1],draft.roster[i]]=[draft.roster[i],draft.roster[i+1]];mark();renderEdit();}},"↓"),
    h("button",{class:"icon","aria-label":"Remove",onclick:()=>{ if(confirm("Remove "+(k.name||"this student")+"?")){draft.roster.splice(i,1);mark();renderEdit();} }},"✕"))));
  list.append(h("button",{class:"btn",onclick:()=>{draft.roster.push({id:uid(),name:"",photo:""});mark();renderEdit();setTimeout(()=>{const ins=app.querySelectorAll(".srow input");ins[ins.length-1]?.focus();},0);}},"+ Student"));
  wrap.append(list);
  const save=h("button",{class:"btn solid",onclick:async()=>{
    save.disabled=true; save.textContent="Saving…";
    try{
      const clean=draft.roster.filter(k=>k.name.trim()).map(k=>({id:k.id,name:k.name.trim(),photo:k.photo||""}));
      const r=await apiPost({action:"roster",roster:clean});
      const next={...settings, feelSymbols:draft.syms};
      if((draft.song||"")!==(settings.songUrl||DEFAULT_SONG)){
        if(draft.song&&!ytId(draft.song)) toast("That song link doesn't look like YouTube. Kept the old song.");
        else next.songUrl=draft.song;
      }
      if(JSON.stringify(next)!==JSON.stringify(settings)){ settings=next; await apiPost({action:"settings",settings}); }
      roster=clean; rosterVersion=r.rosterVersion; draft=null; toast("Saved");
      go("remote");
    }catch(e){ toast("Couldn't save. Check Wi-Fi and try again."); save.disabled=false; save.textContent="Save"; }
  }},"Save");
  wrap.append(h("div",{class:"row",style:{"justify-content":"flex-start"}},save,
    h("button",{class:"btn",onclick:()=>{ if(!draft.dirty||confirm("Leave without saving?")){draft=null;go("remote");} }},"Cancel")));
  const y=window.scrollY; app.replaceChildren(wrap); window.scrollTo(0,y);
}
function openSym(f){ draft.open=f.id; draft.q=f.label; draft.results=[]; renderEdit(); runSym(f.label); }
async function runSym(term){
  term=(term||"").trim(); if(!term||!draft) return;
  draft.q=term; draft.searching=true; draft.results=[]; renderEdit();
  try{ draft.results=(await araSearch(term,false)).slice(0,24); }catch(e){ toast("Couldn't reach the symbol library."); }
  if(!draft) return; draft.searching=false; renderEdit();
}
// shrink photos to a small square so they fit in a Sheet cell
function pickPhoto(cb){
  const inp=h("input",{type:"file",accept:"image/*",style:{display:"none"}});
  document.body.append(inp);
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; inp.remove(); if(!f) return;
    const img=new Image(), url=URL.createObjectURL(f);
    img.onload=()=>{
      const s=Math.min(img.naturalWidth,img.naturalHeight), c=document.createElement("canvas"); c.width=c.height=200;
      c.getContext("2d").drawImage(img,(img.naturalWidth-s)/2,(img.naturalHeight-s)/2,s,s,0,0,200,200);
      URL.revokeObjectURL(url);
      let q=.8, out=c.toDataURL("image/jpeg",q);
      while(out.length>40000&&q>.3){ q-=.1; out=c.toDataURL("image/jpeg",q); }
      cb(out);
    };
    img.onerror=()=>{URL.revokeObjectURL(url);toast("Couldn't open that picture. Try a different one.");};
    img.src=url;
  });
  inp.click();
}

/* ---------- start ---------- */
if(screen && screen!=="edit") ls("am-screen",screen);
render();
if(cfg.url&&cfg.code) startPolling();
setTimeout(fillAutoSymbols, 1500);
})();
